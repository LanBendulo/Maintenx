<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{Subject}} - MaintenX</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f4f4;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .email-wrapper {
            width: 100%;
            background-color: #f4f4f4;
            padding: 20px 0;
        }
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .email-header {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            padding: 30px;
            text-align: center;
        }
        .email-logo {
            color: #ffffff;
            font-size: 32px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
        }
        .email-logo span {
            color: #f97316;
        }
        .email-body {
            padding: 40px 30px;
        }
        .email-title {
            color: #1f2937;
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 20px 0;
        }
        .email-text {
            color: #4b5563;
            font-size: 16px;
            line-height: 1.6;
            margin: 0 0 20px 0;
        }
        .email-button {
            display: inline-block;
            padding: 14px 32px;
            background-color: #2563eb;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            margin: 20px 0;
            transition: background-color 0.2s;
        }
        .email-button:hover {
            background-color: #1d4ed8;
        }
        .email-link {
            color: #2563eb;
            font-size: 14px;
            word-break: break-all;
            text-decoration: none;
        }
        .email-divider {
            border: 0;
            border-top: 1px solid #e5e7eb;
            margin: 30px 0;
        }
        .email-footer {
            background-color: #f9fafb;
            padding: 20px 30px;
            text-align: center;
            border-top: 1px solid #e5e7eb;
        }
        .email-footer-text {
            color: #6b7280;
            font-size: 12px;
            margin: 5px 0;
        }
        .email-note {
            background-color: #eff6ff;
            border-left: 4px solid #2563eb;
            padding: 12px 16px;
            margin: 20px 0;
            border-radius: 4px;
        }
        .email-note p {
            color: #1e40af;
            font-size: 14px;
            margin: 0;
            line-height: 1.5;
        }
        @media only screen and (max-width: 600px) {
            .email-container {
                border-radius: 0;
            }
            .email-body {
                padding: 30px 20px;
            }
            .email-title {
                font-size: 20px;
            }
            .email-text {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="email-wrapper">
        <div class="email-container">
            <!-- Header -->
            <div class="email-header">
                <h1 class="email-logo">Mainten<span>X</span></h1>
            </div>
            
            <!-- Body Content -->
            <div class="email-body">
                {{Content}}
            </div>
            
            <!-- Footer -->
            <div class="email-footer">
                <p class="email-footer-text">© {{CurrentYear}} MaintenX. All rights reserved.</p>
                <p class="email-footer-text">Industrial-grade maintenance management system</p>
            </div>
        </div>
    </div>
</body>
</html>
